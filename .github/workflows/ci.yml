name: CI - Lint & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: ✅ Type checking
        run: npm run type-check

      - name: 🧪 Tests
        run: npm test

      - name: 🏗️ Build
        run: npm run build
        env:
          # Placeholders so route modules can be imported while Next collects page data.
          OPENAI_API_KEY: sk-ci-placeholder
          AUTH_SECRET: ci-placeholder-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          DIRECT_URL: postgresql://user:pass@localhost:5432/ci

      - name: 📄 Generate Prisma
        run: npm run prisma:generate
        continue-on-error: true
